name: Debug DWD Freshness

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Compare freshness of candidate realtime sources
        run: |
          echo "=== now UTC ==="
          date -u

          echo
          echo "=== [A] DWD POI current observations: find Munich station ==="
          curl -sL "https://opendata.dwd.de/weather/weather_reports/poi/" \
            | grep -o 'href="[^"]*"' | grep -E '108[0-9]{2}|10865|10870' | head -20 || echo "no 108xx match"

          echo
          echo "=== [A2] POI 10870 (Muenchen-Flughafen?) last-modified + tail ==="
          curl -sI "https://opendata.dwd.de/weather/weather_reports/poi/10870_-BEOB.csv" \
            | grep -i -E 'HTTP/|last-modified|content-length'
          curl -sL "https://opendata.dwd.de/weather/weather_reports/poi/10870_-BEOB.csv" \
            | head -3
          echo "--- tail ---"
          curl -sL "https://opendata.dwd.de/weather/weather_reports/poi/10870_-BEOB.csv" \
            | tail -3

          echo
          echo "=== [B] Open-Meteo current temperature_2m ==="
          curl -sL "https://api.open-meteo.com/v1/forecast?latitude=48.3538&longitude=11.7861&current=temperature_2m&timezone=UTC"

          echo
          echo
          echo "=== [C] METAR history (last 3h) — observation cadence ==="
          curl -sL "https://aviationweather.gov/api/data/metar?ids=EDDM&format=raw&hours=3"
