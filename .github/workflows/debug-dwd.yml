name: Debug DWD Freshness

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check DWD POI current observations for Munich
        run: |
          echo "=== now UTC ==="
          date -u
          for id in 10870 10865; do
            echo
            echo "=== POI $id ==="
            curl -sI "https://opendata.dwd.de/weather/weather_reports/poi/${id}-BEOB.csv" \
              | grep -i -E 'HTTP/|last-modified'
            echo "--- header rows ---"
            curl -sL "https://opendata.dwd.de/weather/weather_reports/poi/${id}-BEOB.csv" | head -3
            echo "--- newest rows ---"
            curl -sL "https://opendata.dwd.de/weather/weather_reports/poi/${id}-BEOB.csv" | sed -n '4,7p'
          done
