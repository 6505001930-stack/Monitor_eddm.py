name: Monitor EDDM Weather

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Munich Airport (EDDM) weather monitor
        run: python3 Monitor_eddm.py
