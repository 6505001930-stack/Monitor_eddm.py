name: Monitor EDDM Weather

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug DWD directory listing (temporary)
        run: |
          echo "--- status codes ---"
          for u in \
            "https://opendata.dwd.de/" \
            "https://opendata.dwd.de/climate_environment/" \
            "https://opendata.dwd.de/climate_environment/CDC/" \
            "https://opendata.dwd.de/climate_environment/CDC/observations_germany/" \
            "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/" \
            "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/" \
            "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/" \
            "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/now/" \
            ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$u")
            echo "$code  $u"
          done
          echo "--- first 2000 chars of 10_minutes/air_temperature/ ---"
          curl -sL "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/" | head -c 2000
          echo
          echo "--- first 3000 chars of .../now/ ---"
          curl -sL "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/now/" | head -c 3000

      - name: Run Munich Airport (EDDM) weather monitor
        run: python3 Monitor_eddm.py
