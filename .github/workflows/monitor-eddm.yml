name: Monitor EDDM Weather

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug DWD directory listing (temporary)
        run: |
          echo "--- .txt files in now/ ---"
          curl -sL "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/now/" | grep -o 'href="[^"]*\.txt"' || echo "none"
          echo "--- total zip count in now/ ---"
          curl -sL "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/now/" | grep -c '\.zip"'
          echo "--- meta_data/ listing (first 3000 chars) ---"
          curl -sL "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/meta_data/" | head -c 3000
          echo
          echo "--- recent/ .txt files ---"
          curl -sL "https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/air_temperature/recent/" | grep -o 'href="[^"]*\.txt"' || echo "none"

      - name: Run Munich Airport (EDDM) weather monitor
        run: python3 Monitor_eddm.py
